name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v0.1.6
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build and publish DMG
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Prepare source tree for manual backfill
        if: github.event_name == 'workflow_dispatch'
        run: |
          TARGET_TAG="${{ inputs.tag }}"
          git fetch --force origin "refs/tags/$TARGET_TAG:refs/tags/$TARGET_TAG"
          git checkout "$TARGET_TAG" -- .
          git checkout HEAD -- scripts/build_dmg.sh scripts/verify_dmg.sh

          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"

          if [[ "v$APP_VERSION" != "$TARGET_TAG" ]]; then
            echo "Checked out source version v$APP_VERSION does not match requested tag $TARGET_TAG." >&2
            exit 1
          fi

      - name: Validate signing and notarization secrets
        env:
          MACOS_DEVELOPER_ID_APPLICATION_P12: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 }}
          MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          MACOS_BUILD_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_BUILD_KEYCHAIN_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          missing=()

          for secret_name in \
            MACOS_DEVELOPER_ID_APPLICATION_P12 \
            MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD \
            MACOS_BUILD_KEYCHAIN_PASSWORD \
            MACOS_DEVELOPER_ID_APPLICATION_IDENTITY \
            APPLE_API_KEY_P8 \
            APPLE_API_KEY_ID; do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("$secret_name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi

          cert_path="$RUNNER_TEMP/codesign.p12"
          echo -n "$MACOS_DEVELOPER_ID_APPLICATION_P12" | base64 --decode > "$cert_path"

          if ! openssl pkcs12 \
            -in "$cert_path" \
            -passin "pass:$MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -nokeys \
            -clcerts >/dev/null 2>&1; then
            echo "Decoded MACOS_DEVELOPER_ID_APPLICATION_P12 is not a valid PKCS#12 payload or the password is incorrect." >&2
            exit 1
          fi

          api_key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"

          if ! openssl pkey -in "$api_key_path" -pubout >/dev/null 2>&1; then
            echo "Decoded APPLE_API_KEY_P8 is not a valid App Store Connect API private key." >&2
            exit 1
          fi

      - name: Select Xcode 26.3
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/codesign.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codesign.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "BUILD_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEYCHAIN_PATH="${BUILD_KEYCHAIN_PATH:-$RUNNER_TEMP/codesign.keychain-db}"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          PROFILE_NAME="codextoolbar-notary"

          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          args=(
            store-credentials
            "$PROFILE_NAME"
            --key "$API_KEY_PATH"
            --key-id "$APPLE_API_KEY_ID"
            --keychain "$KEYCHAIN_PATH"
            --validate
          )

          if [[ -n "${APPLE_API_ISSUER_ID:-}" ]]; then
            args+=(--issuer "$APPLE_API_ISSUER_ID")
          fi

          xcrun notarytool "${args[@]}"

          echo "NOTARYTOOL_KEYCHAIN_PROFILE=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "NOTARYTOOL_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build signed and notarized DMG
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY }}
          REQUIRE_DISTRIBUTION_SIGNING: "true"
          VERIFY_DMG_AFTER_BUILD: "true"
        run: ./scripts/build_dmg.sh

      - name: Verify DMG before upload
        run: ./scripts/verify_dmg.sh dist/*.dmg

      - name: Delete existing DMG asset when backfilling
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          DMG_NAME="CodexToolbar-${TAG#v}.dmg"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" "$DMG_NAME" --yes >/dev/null 2>&1 || true
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: codextoolbar-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg --clobber
          else
            gh release create "$TAG" dist/*.dmg --generate-notes --verify-tag
          fi

      - name: Check out main for site sync
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Update site release links
        run: ./scripts/update_site_release_links.sh "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

      - name: Commit site release link update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- site/index.html; then
            exit 0
          fi
          git add site/index.html
          git commit -m "Update site download links for ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          git push origin HEAD:main
